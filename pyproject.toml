[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmulator"
dynamic = ["version"]
authors = [
    { name = "Dily Duan Yi Ong", email = "dlo26@cam.ac.uk" },
]
description = "Train, validate and serve machine-learning emulators of posterior distributions"
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
# The JAX training stack sets the floor. Declaring anything lower produces an
# install that imports but cannot train.
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "requests",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
"Homepage" = "https://github.com/DilyOng/cosmulator"
"Bug Tracker" = "https://github.com/DilyOng/cosmulator/issues"
"Documentation" = "https://cosmulator.readthedocs.io"

[project.optional-dependencies]
# The training stack is deliberately optional. Importing cosmulator, inspecting
# stored emulators and running the test suite must not require JAX, so that a
# reviewer or a laptop user can install and exercise the package cheaply.
train = ["jax", "optax", "flowjax", "equinox"]
hpo = ["optuna"]
docs = ["sphinx", "sphinx_rtd_theme", "numpydoc"]
test = ["pytest", "pytest-cov", "flake8", "pydocstyle", "packaging", "pre-commit"]

[tool.setuptools.packages.find]
include = ["cosmulator*"]

[tool.setuptools.dynamic]
version = { attr = "cosmulator._version.__version__" }

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: requires the optional training stack and a GPU",
]
