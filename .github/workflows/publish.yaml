name: Publish to PyPI

# Publishes to PyPI via OIDC Trusted Publishing -- NO API token is stored. It runs
# only when a GitHub Release is published, and only succeeds once the matching
# "pending publisher" is registered on PyPI (see cosmulator_notes for the one-time
# setup). Until then, creating a release simply fails at the publish step -- it
# never publishes anything by accident.

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cosmulator
    permissions:
      id-token: write        # REQUIRED for OIDC Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
